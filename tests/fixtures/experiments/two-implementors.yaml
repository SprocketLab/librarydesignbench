version: "1.0.0"
tasks: [pyt, rsj]
design:
  attempts: 2
  prompt: design.md
  sandbox: {cpus: 2, memory_mb: 4096, storage_mb: 10240}
evaluation:
  agents:
    # Both implementors run one agent and one model, so only the config key
    # tells their cells apart.
    luna:
      name: oracle
      model_name: dummy
      kwargs: {reasoning_effort: high}
    nova:
      name: oracle
      model_name: dummy
      kwargs: {reasoning_effort: low}
  attempts: 2
  prompt: implement.md
  sandbox: {cpus: 1, memory_mb: 2048, storage_mb: 8192}
